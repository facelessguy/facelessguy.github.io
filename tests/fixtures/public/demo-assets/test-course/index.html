<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Проверочный интерактив</title><style>body{font:18px/1.7 system-ui;max-width:650px;margin:3rem auto;padding:1rem;background:#f5f5f2;color:#20231f}button{font:inherit;padding:.7rem 1rem;background:#c8f536;border:1px solid;cursor:pointer}fieldset{margin:2rem 0;padding:1.5rem}label{display:block;margin:.8rem 0}a{color:inherit}</style><main><p>Технический тест · Не реальный курс</p><h1>С чего начинается решение?</h1><form><fieldset><legend>Выберите один ответ</legend><label><input type="radio" name="answer" value="problem" required> С понимания задачи</label><label><input type="radio" name="answer" value="tool"> С выбора инструмента</label></fieldset><button type="submit">Проверить</button></form><p id="feedback" role="status"></p><noscript><p>Ответ: сначала нужно понять задачу, аудиторию и ограничения.</p></noscript><a href="/projects/course/">Вернуться к тестовому кейсу</a></main><script>document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();const correct=new FormData(event.target).get('answer')==='problem';document.querySelector('#feedback').textContent=correct?'Верно. Сначала формулируем проблему и критерий успеха.':'Попробуйте ещё раз: инструмент выбирают после понимания задачи.';});</script></html>
